name: Pytest & CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        
    - name: Instalar dependencias del sistema
      run: |
        sudo apt-get update -q
        sudo apt-get install -y libgomp1

    - name: Instalar dependencias Python (ligeras para CI)
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements-ci.txt

    - name: Crear stubs de CatBoost/LightGBM para CI
      run: |
        python -c "
        import sys, types

        # Stub de catboost
        cb = types.ModuleType('catboost')
        class _CatBoostClassifier:
            def fit(self, *a, **kw): pass
            def predict(self, X): return [0]*len(X)
            def predict_proba(self, X): return [[0.5,0.5]]*len(X)
        class _CatBoostRegressor:
            def fit(self, *a, **kw): pass
            def predict(self, X): return [110.0]*len(X)
        cb.CatBoostClassifier = _CatBoostClassifier
        cb.CatBoostRegressor  = _CatBoostRegressor
        sys.modules['catboost'] = cb

        # Stub de lightgbm
        lgb = types.ModuleType('lightgbm')
        class _LGBMClassifier:
            def fit(self, *a, **kw): pass
            def predict(self, X): return [0]*len(X)
            def predict_proba(self, X): return [[0.5,0.5]]*len(X)
        lgb.LGBMClassifier = _LGBMClassifier
        sys.modules['lightgbm'] = lgb
        print('✅ Stubs creados correctamente')
        "

    - name: Ejecutar pruebas unitarias
      run: |
        cd backend
        python -m pytest tests/test_api.py tests/test_data_quality.py -v --tb=short \
          --ignore=tests/test_ml_pipeline.py \
          -p no:warnings > pytest_output.txt 2>&1 || true
        cat pytest_output.txt
        
        if grep -q "FAILED\|ERROR\|Traceback\|ImportError" pytest_output.txt; then
          echo "::error::--- DETALLE DEL FALLO EN PYTEST ---"
          tail -n 30 pytest_output.txt | while read line; do echo "::error::$line"; done
          exit 1
        fi

      env:
        KAGGLE_API_TOKEN: "ci-stub-token"
