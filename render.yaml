services:
  - type: web
    name: nba-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 5
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SELF_URL
        sync: false   # Lo agregas manualmente en el dashboard de Render
    healthCheckPath: /health

  - type: web
    name: nba-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: nba-backend
          property: host
