services:
  - type: web
    name: nba-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120 --keep-alive 5 --log-level info
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SELF_URL
        sync: false   # Lo agregas manualmente en el dashboard de Render
    healthCheckPath: /health
